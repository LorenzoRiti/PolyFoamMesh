name: CI

# Runs on every push and PR targeting the default branch.
# Mirrors the local pre-commit gate (`.pre-commit-config.yaml`):
#   1. ruff — BUG rules only (E9/F/B) on src/ and tests/
#   2. pytest — fast subset: excludes `slow` (real GMSH/aggregator runs)
#      and `wsl` (live WSL2 + OpenFOAM). These need a Windows+WSL2+OpenFOAM
#      environment that a Linux CI runner cannot provide.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Headless Qt for the GUI tests (PySide6/QApplication). The offscreen
      # platform plugin renders without a display server; without it
      # QApplication fails to start on the runner.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Install native libraries (Qt/EGL + GLU for GMSH)
        # ubuntu-latest ships no GUI libraries. The PySide6 GUI tests dlopen
        # libEGL/libGL/libxkbcommon and the gmsh wheel dlopens libGLU at
        # import time. Without them pytest dies at COLLECTION with
        # "ImportError: libEGL.so.1 / libGLU.so.1: cannot open shared object
        # file", aborting the run with exit code 2.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglu1-mesa \
            libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package + test deps
        run: pip install -e ".[test]"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff — E9/F/B bug rules)
        run: ruff check src/ tests/

      - name: Version sync (pyproject / _version / installer)
        run: python tools/check_version_sync.py

      - name: Test (fast suite — no slow, no wsl)
        run: >-
          pytest tests/ -m "not slow and not wsl" -q --no-header
          -p no:cacheprovider
