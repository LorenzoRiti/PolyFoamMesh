name: CI

# Runs on every push and PR targeting the default branch.
# Mirrors the local pre-commit gate (`.pre-commit-config.yaml`):
#   1. ruff — BUG rules only (E9/F/B) on src/ and tests/
#   2. pytest — fast subset: excludes `slow` (real GMSH/aggregator runs)
#      and `wsl` (live WSL2 + OpenFOAM). These need a Windows+WSL2+OpenFOAM
#      environment that a Linux CI runner cannot provide.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Headless Qt for the GUI tests (PySide6/QApplication). The offscreen
      # platform plugin renders without a display server; without it
      # QApplication fails to start on the runner.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Install native libraries (Qt/EGL + GLU for GMSH)
        # ubuntu-latest ships no GUI libraries. The PySide6 GUI tests dlopen
        # libEGL/libGL/libxkbcommon and the gmsh wheel dlopens libGLU at
        # import time. Without them pytest dies at COLLECTION with
        # "ImportError: libEGL.so.1 / libGLU.so.1: cannot open shared object
        # file", aborting the run with exit code 2.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglu1-mesa \
            libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package + test deps
        run: pip install -e ".[test]"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff — E9/F/B bug rules)
        run: ruff check src/ tests/

      - name: Version sync (pyproject / _version / installer)
        run: python tools/check_version_sync.py

      - name: Test (fast suite — no slow, no wsl)
        run: >-
          pytest tests/ -m "not slow and not wsl" -q --no-header
          -p no:cacheprovider

      - name: Verify Linux (POSIX) command dispatch
        # This runner IS the Linux target: prove the keystone dispatches to a
        # native `bash -lc` with no wsl.exe anywhere, and that the WSL-only
        # RAM probe short-circuits to None here.
        run: |
          python -c "import sys, polyfoammesh.config as c, polyfoammesh.core.hardware_budget as hb; \
          assert sys.platform.startswith('linux'); \
          cmd=c.OFConfig()._build_wsl_cmd('true'); \
          assert cmd==['bash','-lc','true'], cmd; \
          assert not any('wsl' in str(x).lower() for x in c.OFConfig().build_command('/tmp/case')), 'wsl.exe leaked'; \
          assert hb.wsl_ram_bytes() is None; \
          print('POSIX dispatch OK:', cmd)"

# ---------------------------------------------------------------------------
# Optional: OpenFOAM/cfMesh integration on Linux.
#
# The fast suite above deliberately excludes the `wsl`-marked tests: they
# exercise a REAL cartesianMesh run and need OpenFOAM on PATH. On Linux that
# means installing OpenFOAM on the runner, which is version- and
# distro-specific (the OpenFOAM Foundation apt repo, or a source build at
# /opt/openfoam2512). The ubuntu-latest image does not ship it, so this is
# documented rather than enabled — a broken/403 apt repo would make every
# push red for reasons unrelated to the code. To enable it on a runner image
# that has OpenFOAM installed:
#
#   integration-linux:
#     runs-on: ubuntu-latest
#     continue-on-error: true
#     env:
#       QT_QPA_PLATFORM: offscreen
#       POLYFOAMMESH_OF_BASHRC: /opt/openfoam2512/etc/bashrc
#     steps:
#       - uses: actions/checkout@v4
#       - uses: actions/setup-python@v5
