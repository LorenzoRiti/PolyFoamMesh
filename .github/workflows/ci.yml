name: CI

# Runs on every push and PR targeting the default branch.
# Mirrors the local pre-commit gate (`.pre-commit-config.yaml`):
#   1. ruff — BUG rules only (E9/F/B) on src/ and tests/
#   2. pytest — fast subset: excludes `slow` (real GMSH/aggregator runs)
#      and `wsl` (live WSL2 + OpenFOAM). These need a Windows+WSL2+OpenFOAM
#      environment that a Linux CI runner cannot provide.
#
# ubuntu-latest ships none of the shared libs PySide6/Qt6 and GMSH dlopen
# at import time (no X server, minimal image): missing libEGL.so.1 broke
# every test module that imports PySide6.QtWidgets, missing libGLU.so.1
# broke every module that imports gmsh. QT_QPA_PLATFORM=offscreen avoids a
# second failure (no display) once the libs themselves are importable.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install system libs (Qt/PySide6 + GMSH need these headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglu1-mesa \
            libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package + test deps
        run: pip install -e ".[test]"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff — E9/F/B bug rules)
        run: ruff check src/ tests/

      - name: Version sync (pyproject / _version / installer)
        run: python tools/check_version_sync.py

      - name: Test (fast suite — no slow, no wsl)
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          pytest tests/ -m "not slow and not wsl" -q --no-header
          -p no:cacheprovider
