# Pre-commit hooks — local quality gate (ruff + fast tests).
#
# INSTALL (once, from the project root):
#   C:\Users\Davide Valoroso\AppData\Local\Programs\Python\Python311\python.exe -m pre_commit install
#
# Then every "git commit" runs the hooks below automatically:
#   - ruff check  (fast: only staged .py files, ~1-2 s)
#   - pytest fast subset via markers: `-m "not slow and not wsl"` (~44 s)
#
# To bypass in an emergency:  git commit --no-verify
#
# NOTE ON WINDOWS + PATHS: pre-commit parses "entry" with POSIX shell
# rules, which eat backslashes (C:\Users\... becomes C:Users...). The
# entry lines therefore use forward slashes (Windows accepts them) and
# double quotes around the path (it contains a space in "Davide Valoroso").
# If you move the project to another machine, update the two "entry:"
# lines below with that machine's Python path.
#
# SCOPE: ruff checks only src/ and tests/ (the quality gate from
# pyproject.toml). tools/ is excluded because it holds tracked scratch
# scripts with pre-existing lint debt — decide separately whether to
# clean them or drop them from git.
#
# The test selector uses the real markers (pyproject.toml):
#   - slow : long-running tests (real GMSH/aggregator runs)
#   - wsl  : tests that run real cartesianMesh/OpenFOAM in WSL2
# Excluding both leaves a green ~44 s suite that covers everything that
# does NOT need GMSH-heavy work or a live OpenFOAM install. The full
# suite (including slow+wsl) is run manually:
#   <python311> -m pytest tests -m "not slow and not wsl"   # fast gate
#   <python311> -m pytest tests                              # everything

repos:
  - repo: local
    hooks:
      # --- Fast quality gate on staged .py files (E9/F/B rules) ---
      - id: ruff
        name: ruff check (staged files)
        entry: '"C:/Users/Davide Valoroso/AppData/Local/Programs/Python/Python311/python.exe" -m ruff check'
        language: system
        types: [python]
        exclude: '^tools/'

      # --- Fast pytest suite via markers (no slow, no wsl) ---
      - id: pytest-fast
        name: "pytest fast suite (markers: not slow, not wsl)"
        entry: '"C:/Users/Davide Valoroso/AppData/Local/Programs/Python/Python311/python.exe" -m pytest tests -m "not slow and not wsl" -q --no-header -p no:cacheprovider'
        language: system
        pass_filenames: false
        always_run: true
